# source color file
source-file "$HOME/.dotfiles/nixos/modules/editors/tmux/themes/gruvbox-dark-tmux.conf"

set -g pane-border-lines heavy

## Theme settings mixed with colors
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# default statusbar color
set-option -g status-style "bg=#{@bg1},fg=#{@fg1}"

# pane border
set-option -g pane-active-border-style "fg=#{E:#{@active}}"
set-option -g pane-border-style "fg=#{@bg1}"

# message infos
set-option -g message-style "bg=#{@purple},fg=#{@fg1}"

# writing commands inactive
set-option -g message-command-style "bg=#{@purple},fg=#{@fg1}"

# selection when in copy paste mode, and prefix+s selection
set-option -g mode-style "bg=#{E:#{@active}},fg=#{@fg2}"

# display
# - session name
# - prefix indicator (gray at rest, orange while prefix key is active)
set -g @session_name "#[bg=#{@bg3},fg=#{@fg1}] #S "
set -g @prefix_ind   "#{?client_prefix,#[bg=#{@gray}#,fg=#{@fg2}] ,#[bg=#{@orange}#,fg=#{@fg2}] }"
set-option -g status-left "#{E:#{@session_name}}#{E:#{@prefix_ind}}"

# - battery (if present)
#   - blue   = normal
#   - green  = charging
#   - red    = crit <=10%
#   - orange = low  <=20%
set -g @battery "#{?#(acpi -b 2>/dev/null),\
#{?#(acpi -a 2>/dev/null | grep -q on && echo 1),#[bg=#{@green}],\
#{?#(acpi -b 2>/dev/null | grep -o '[0-9]*%' | tr -d '%' | grep -qE '^[0-9]$|^10$' && echo 1),#[bg=#{@red}],\
#{?#(acpi -b 2>/dev/null | grep -o '[0-9]*%' | tr -d '%' | grep -qE '^[0-9]$|^1[0-9]$|^20$' && echo 1),#[bg=#{@orange}],#[bg=#{@blue}]}}}\
#[fg=#{@fg1}] #(acpi -b | grep -o '[0-9]*%') ,}"
set -g @hostname_str "#[bg=#{@purple},fg=#{@fg1}] #h "
set -g @timestamp "#[bg=#{@bg3},fg=#{@fg1}] %Y-%m-%dT%H:%M "

set-option -g status-right "#{E:#{@battery}}#{E:#{@hostname_str}}#{E:#{@timestamp}}"

# format + color for window selection aspect of status bar
# '#I' is window number
# '#W' is window title
set-window-option -g window-status-current-format "#[bg=#{E:#{@active}},fg=#{@fg2}] #I #W #{?window_zoomed_flag,*Z ,}"
set-window-option -g window-status-format         "#[bg=#{@bg2},fg=#{@fg1}] #I #W "

