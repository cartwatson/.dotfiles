# Gruvbox Light Tmux Colorscheme
# values match helix's gruvbox_light_hard

# gruvbox theme
set -g @bg1 "#ebdbb2" # default background
set -g @bg2 "#d5c4a1" # inside panels
set -g @bg3 "#bdae93" # outside most panels
set -g @fg1 "#282828" # dark text on light background
set -g @fg2 "#f9f5d7" # bg, text on yellow background

## highlights
set -g @yellow "#d79921"
set -g @red    "#cc241d"
set -g @green  "#98971a"
set -g @purple "#b16286"
set -g @blue   "#458588"
set -g @orange "#d65d0e"
set -g @gray   "#928374"

set -g @active "#{@yellow}"

# pane number display
# WARN WARN WARN: colors here cannot be variables, the above are tmux "styles" and these are required to be "colours"
set-option -g display-panes-active-colour "#d79921" #active - yellow
set-option -g display-panes-colour        "#ebdbb2" #bg1
