# Gruvbox Dark Tmux Colorscheme

# gruvbox theme
set -g @bg1 "#4e4e4e" # default background
set -g @bg2 "#3a3a3a" # inside panels
set -g @bg3 "#1c1c1c" # outside most panels
set -g @fg1 "#ebdbb2" # off-white for gray background
set -g @fg2 "#282828" # gray foreground for orange background

## highlights
set -g @yellow "#d79921"
set -g @red    "#cc241d"
set -g @green  "#98971a"
set -g @purple "#b16286"
set -g @blue   "#458488"
set -g @orange "#d86d0e"
set -g @gray   "#928374"

set -g @active "#{@yellow}"

# pane number display
# WARN WARN WARN: colors here cannot be variables, the above are tmux "styles" and these are required to be "colours"
set-option -g display-panes-active-colour "#d79921" #active - yellow
set-option -g display-panes-colour        "#b16286" #purple
