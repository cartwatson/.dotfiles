[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.harper-ls.config.harper-ls]
diagnosticSeverity = "hint"
dialect = "American"

[language-server.harper-ls.config.harper-ls.linters]
SpellCheck = true
SpelledNumbers = false
AnA = true
SentenceCapitalization = false
UnclosedQuotes = true
WrongApostrophe = true
LongSentences = true
RepeatedWords = true
Spaces = true
CorrectNumberSuffix = true

[[language]]
name = "markdown"
language-servers = ["marksman", "harper-ls"]

[language.auto-pairs]
'(' = ')'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'
'*' = '*'
'_' = '_'

[[language]]
name = "nix"
language-servers = ["nil", "nixd", "harper-ls"]

[[language]]
name = "bash"
language-servers = ["bash-language-server", "harper-ls"]

[[language]]
name = "python"
language-servers = ["ty", "ruff", "jedi", "pylsp", "harper-ls"]

[[language]]
name = "rust"
language-servers = ["rust-analyzer", "harper-ls"]

[[language]]
name = "go"
language-servers = ["gopls", "golangci-lint-lsp", "harper-ls"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server", "ansible-language-server", "harper-ls"]
